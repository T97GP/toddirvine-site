sections:
  - id: plan
    type: steps
    tone: stone
    heading: How buying a home works
    intro: "Buying a home is a big decision. Whether it’s your first home or your next chapter, I’ll help you understand the process, explore your options and feel confident about each step."
    items:
      - title: "Let’s talk about your plans"
        text: "We’ll start with a conversation about what’s bringing you to the market, your timeline and what matters most to you. I’ll walk you through the buying process, explain the paperwork and answer your questions so you know what to expect."
      - title: "Get clear on your budget"
        text: "A mortgage pre-approval helps you understand your borrowing options before you start looking. If you need a mortgage professional, I can help you connect with one. We’ll focus your search on a price range that feels comfortable for you."
      - title: "Find out what home means to you"
        text: "From neighbourhoods and commute times to bedrooms, garage space and room for the family, we’ll work through your must-haves and preferences. This helps me narrow the search and send you homes that fit your needs."
      - title: "Explore homes together"
        text: "I’ll arrange viewings and help you look beyond the listing photos. We’ll discuss each home’s features, condition and potential drawbacks, and gather answers to the questions that matter to you."
      - title: "Make an informed offer"
        text: "When you find a home you want, we’ll review comparable sales and discuss an offer strategy. I’ll explain the price, conditions, deposit, possession date and other terms before you sign, then negotiate on your behalf."
      - title: "Arrange your deposit"
        text: "Once your offer is accepted, I’ll explain how and when to provide the deposit according to your purchase agreement. You’ll receive clear instructions about the deadline and where the funds need to go."
      - title: "Take a closer look"
        text: "If your offer includes an inspection condition, we’ll arrange a professional home inspection within the agreed timeline. You can ask the inspector questions, review their findings and discuss your options with me before deciding how to proceed."
      - title: "Work through your conditions"
        text: "I’ll help you track the deadlines and coordinate the steps related to your offer’s conditions, such as financing, inspection or document review. Before you make any decisions about removing conditions, we’ll confirm where things stand and what still needs attention."
      - title: "Arrange your home insurance"
        text: "Contact your insurance provider early to confirm coverage is available and arrange for it to begin when required for your purchase. Getting this underway ahead of time gives you room to address questions before possession."
      - title: "Prepare for moving day"
        text: "Arrange your utilities, internet and other services for your possession date. I’ll help you keep track of the remaining practical details so you can plan your move with fewer last-minute surprises."
      - title: "Complete the closing steps"
        text: "Your lawyer will guide you through the closing documents, required funds and legal transfer. I’ll coordinate with the people involved and stay available to help with questions as possession approaches."
      - title: "Get your keys and settle in"
        text: "Once closing is complete and the keys are authorized for release, it’s time to enjoy your new home. I’ll coordinate the key handover and remain available if questions come up after your move."
    outro: "Ready to start your home search? Let’s talk about what you’re looking for and the best next step for you."

