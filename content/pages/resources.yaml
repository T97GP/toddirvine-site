    note: "Todd, three gaps to know about. 1. Public schools: the neighbourhoods come from my reading of the division's 2022 boundary map, which only names some neighbourhoods. Please check them and send me any that are missing or wrong. 2. Catholic schools: only St. Clement lists its neighbourhoods in writing. The rest are on address-search maps I can't read, so those say to see the boundary map. 3. Peace Wapiti schools: I have phone numbers but not street addresses yet."

