heading: Selling your home in Grande Prairie
intro: Start with a free valuation of your home within 24 hours. From there, you get a price built on recent sales, marketing I pay for, and an update from me every week until it's sold.
actions:
  - label: Get my free valuation
    url: /sellers/home-valuation/
  - label: Book a call
