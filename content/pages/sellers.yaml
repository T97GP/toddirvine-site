    intro: Tell me about your home and I'll send you a personal valuation within 24 hours.

  - id: plan
    type: steps
    tone: stone
    heading: What happens next?
    items:
      - title: Reach out
        text: Phone, text, Zoom or email. This conversation is so I can learn some details about your home and get started on a free market evaluation for you. Things like the address, the year of the home, upgrades, etc.
      - title: I come see your property
        text: I see your home to assess its condition and provide recommendations for what we can do to get you top dollar for your home.
      - title: Game plan to get your home sold
        text: |
          This is where I get your home ready for market. There are many options available, depending on the type of home. This is all done at no cost to you. Services offered are:

          - Professional photos
          - 3D tour of the home for remote buyers
          - Drone footage and aerial shots of the home
          - The ability to bring in a home staging professional
      - title: Marketing & open houses
        text: "Your home's professional photos and video get targeted ad marketing, using Google, YouTube, Facebook, TikTok and Instagram. This exposes your home to people who are actually looking for a home like yours. I also host 2 open houses a month for your property. All of these expenses are paid by me."
      - title: Receiving and accepting an offer
        text: "We document everything and get it all in writing. I'm making sure your interests are protected here. You worked hard for your home, now let me work hard for you!"
      - title: Finalize the deal and key exchange
        text: "Congratulations! You have sold your home. I'm happy for you & appreciate you putting your trust in me with this major decision. I'm happy to answer any questions you might have while we are going over the final stages."
