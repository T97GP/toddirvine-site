title: New to Grande Prairie? What to set up when you move | Todd Irvine
description: Health care, your driver's licence and your vehicle. What to set up when you move to Grande Prairie, Alberta, with links to the official pages.

heading: New to Grande Prairie? Here's what to set up.
intro: The main things to sort out when you move here from another province or country, with links to the official pages so you can check the details for your situation.
dateline: Last checked October 10, 2026

sections:
  - id: at-a-glance
    type: promises
    heading: At a glance
    items:
      - Apply for Alberta health care within 3 months
      - Exchange your driver's licence within 90 days
      - Register your vehicle in Alberta within 90 days

  - id: health
    type: text
    heading: Health care
    body: |
      **Apply for Alberta Health Care Insurance Plan coverage within 3 months of moving here.** If you're coming from another province or territory, coverage starts on the first day of the third month after you become a resident. For example, if you move here on July 12, your coverage starts October 1. Until then, keep using your health card from your previous province. ([Alberta.ca](https://www.alberta.ca/ahcip-moving-to-alberta))

      **Moving from outside Canada?** You may be covered from the day you become a resident, but only if you apply within 3 months. Take your immigration documents, such as a work permit or permanent resident card, to an Alberta registry agent. ([Alberta.ca](https://www.alberta.ca/ahcip-moving-to-alberta))

      **Finding a family doctor.** Search [Alberta Find a Provider](https://albertafindaprovider.ca) for family doctors and nurse practitioners taking new patients. Listings are refreshed at least once a month, so it's worth checking back. For health advice, call 811.

      **Hospital.** Grande Prairie Regional Hospital, at 11205 110 Street, has a 24/7 emergency department. ([Alberta Health Services](https://www.albertahealthservices.ca/FindHealth/facility.aspx?id=1071132))

  - id: driving
    type: text
    tone: stone
    heading: Your driver's licence and vehicle
    body: |
      **Exchange your driver's licence within 90 days of becoming a resident.** Take it to an Alberta registry agent, with proof that you live in Alberta and proof of your legal status in Canada. Your old licence is surrendered and won't be returned. Licences from the United States, and from countries that have an exchange agreement with Alberta, can usually be exchanged without a road test. ([Alberta.ca](https://www.alberta.ca/exchange-non-alberta-licences))

      **Register your vehicle in Alberta within 90 days of moving here.** You'll need Alberta insurance first. A vehicle bought elsewhere in Canada may need an Alberta out-of-province inspection before it can be registered, so ask the registry agent whether yours does. ([Alberta.ca](https://www.alberta.ca/register-vehicle))

