title: Medical professional relocation to Grande Prairie | Todd Irvine, Real Broker
description: Doctors, nurses and other healthcare professionals moving to the Grande Prairie region can plan their home search by video or phone call before they arrive. Todd Irvine, REALTOR® with Real Broker.

heading: Medical professional relocation
intro: "Whether you’re coming to the Grande Prairie region for a new healthcare role or moving on when your contract ends, I’m here to help you plan your next steps. We can connect via Zoom if you’re not currently in the area to discuss your housing needs and timeline, then arrange home viewings once you arrive or prepare your home for sale before you leave."
