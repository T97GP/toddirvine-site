sections:
  - id: plan
    type: steps
    heading: How it works
    items:
      - title: Before you arrive
        text: |
          Your move starts with a conversation about what you need to feel at home. Whether you’re relocating on your own or with family, we’ll build a plan around your priorities and contract start date.

          - Connect from wherever you are. We’ll arrange video or phone calls with your time zone and work schedule in mind.
          - Define your home search. We’ll discuss your budget, preferred communities, commute, and the features that matter most to you.
          - Get to know the area. I’ll help you compare Grande Prairie and surrounding communities, including access to your workplace, schools, amenities, and recreation.
          - Explore homes remotely. Video walkthroughs will give you a closer look at suitable homes, with honest observations and time for your questions.
          - Connect with local professionals. If needed, I can refer you to a mortgage lender and help coordinate inspections and other steps as your purchase progresses.
          - Build a practical timeline. We’ll work back from your anticipated arrival and contract start date, allowing time for your search, purchase conditions, and possession.
      - title: Once you arrive
        text: |
          With your priorities established, we can make the most of your time here. Your in-person search will focus on homes and neighbourhoods that suit your needs, with room to adjust as you get to know the area.

          - Arrange focused viewings. We’ll plan appointments around your availability, including work commitments where possible.
          - Explore your preferred neighbourhoods. See the surroundings firsthand and get a better feel for your commute and everyday routines.
          - Review your options together. I’ll help you compare each home’s features, condition, and price so you can make an informed decision.
          - Move through the purchase with guidance. When you find the right fit, I’ll explain the offer process, negotiate on your behalf, and coordinate with the professionals involved through possession.
      - title: When it’s time for your next move
        text: |
          Whether your contract is ending, you’re accepting a new position, or your plans have changed, we’ll create a selling plan that reflects your timeline. If you’ve already relocated, we can manage communication remotely so you stay informed wherever work takes you.

          - Review your home’s market position. We’ll look at recent comparable sales, current competition, and your timing to develop a pricing strategy.
          - Prepare for listing. I’ll guide you through practical preparation, photography, marketing, and showing arrangements.
          - Stay informed throughout the sale. You’ll receive updates on activity, buyer feedback, and next steps, with video calls to discuss strategy when needed.
          - Navigate offers and closing. I’ll walk you through offers, negotiate on your behalf, and help coordinate the steps toward possession, including if you’ve already moved.
